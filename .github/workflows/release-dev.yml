name: CD Dev

# Build-and-package only, same as release.yml — never deploys anywhere.
# Triggered automatically once CI Tests finishes running against the dev
# branch — not directly on push — and only proceeds if that CI Tests run
# passed. No manual trigger.
#
# Why workflow_run instead of push: CI Tests (test.yml) already triggers on
# the exact same `push: branches: [dev]` event this workflow cares about. A
# workflow triggered directly by that push would start racing CI Tests
# itself, with no guarantee CI Tests had even started — let alone passed —
# by the time this workflow's own gate checked it. Triggering on CI Tests'
# own completion instead sidesteps that: this workflow doesn't run until CI
# Tests is already done, and its conclusion is read straight off the
# triggering event (github.event.workflow_run.conclusion) — no polling, no
# follow-up API query needed (contrast release.yml's verify-tests-passed,
# which does need one, because it's triggered by an unrelated `release`
# event that has no built-in link to any CI Tests run).
#
# The commit actually being built is github.event.workflow_run.head_sha —
# NOT github.sha, which on a workflow_run-triggered run refers to this
# workflow file's own ref, not the commit CI Tests ran against.
#
# GitHub Actions quirk worth knowing: workflow_run always runs the copy of
# this file that's on the repository's default branch (main), regardless of
# what dev's copy looks like — an edit here only takes effect for future
# runs once merged to main.
#
# Server/web/admin build steps mirror release.yml's exactly (this file is
# fully self-contained — no dependency on any other workflow file). The
# only real difference is the mobile app: EXPO_PUBLIC_RUNTIME_API_URL_ENABLED=true
# switches on the runtime server-URL gate screen (see
# APP/mobile/src/components/ServerUrlGate.tsx) and mobile/app.config.js's
# dev bundle ID / display name, neither of which production ever sets.
#
# All artifacts publish to one rolling `dev-latest` pre-release, replacing
# its assets on every run — see ensure-dev-release below.
on:
  workflow_run:
    workflows: ["CI Tests"]
    types: [completed]
    branches: [dev]

# Cancel any older in-flight run the moment a newer one starts. Without
# this, two runs triggered close together could finish out of order and
# leave dev-latest holding an artifact built from an older commit than its
# sibling artifact — see build-server / build-android-dev below, which
# upload independently. Only one branch ever triggers this workflow, so a
# single fixed group name is enough.
concurrency:
  group: release-dev
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  DEV_RELEASE_TAG: dev-latest

