  ensure-dev-release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      DEV_RELEASE_NOTES: >-
        Automatically built by release-dev.yml whenever CI Tests passes on
        the dev branch — this is not a manual run. Not for production use —
        the API server URL is entered at runtime by whoever installs this
        build.
    steps:
      - name: Delete existing dev-latest release and tag, if present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if gh release view "$DEV_RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "dev-latest exists — deleting release and tag before recreating."
            gh release delete "$DEV_RELEASE_TAG" --repo "${{ github.repository }}" --yes --cleanup-tag
          else
            echo "dev-latest does not exist yet — nothing to delete."
          fi

      - name: Recreate dev-latest pre-release from scratch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release create "$DEV_RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --title "Dev (rolling)" \
            --notes "$DEV_RELEASE_NOTES" \
            --prerelease \
            --target "${{ github.event.workflow_run.head_sha }}"

  # Web build, on its own so it can run in parallel with build-admin.
  # Uploads dist/ as an artifact for build-server to assemble later.
  build-web:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # web imports from ../shared (via the @shared alias) at build time —
      # only its node_modules are needed (axios, date-fns), not a compiled
      # dist/: Vite transpiles shared's .ts source directly.
      - name: Install shared's dependencies
        working-directory: APP/shared
        run: npm ci

      - name: Install and build web
        working-directory: APP/web
        run: |
          npm ci
          npm run build

      - name: Upload web build output
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: APP/web/dist

  # Admin build, on its own so it can run in parallel with build-web. Admin
  # doesn't import from shared at all, so no shared install step is needed.
  build-admin:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install and build admin
        working-directory: APP/admin
        run: |
          npm ci
          npm run build

      - name: Upload admin build output
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: APP/admin/dist

  # Server package: compiled backend + build-web's/build-admin's already-
  # built frontends (downloaded as artifacts) as static bundles under
  # public/web and public/admin, plus the setup docs — zipped and attached
  # to the dev-latest Release. Waits on ensure-dev-release too (not just
  # build-web/build-admin) so it never races build-android-dev to create
  # the release. If any of the three is skipped (CI Tests didn't pass),
  # this is skipped automatically too — no explicit if: needed here.
  build-server:
    needs: [build-web, build-admin, ensure-dev-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install shared and build it
        working-directory: APP/shared
        run: |
          npm ci
          npm run build

      - name: Install and build backend
        working-directory: APP/backend
        run: |
          npm ci
          npm run build

      - name: Download web build output
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: APP/web/dist

      - name: Download admin build output
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: APP/admin/dist

      - name: Assemble the server package
        run: |
          set -eu
          PKG="yahdav-server-${{ env.DEV_RELEASE_TAG }}"
          mkdir -p "$PKG/dist" "$PKG/migrations" "$PKG/docs" "$PKG/public/web" "$PKG/public/admin" "$PKG/shared/dist"

          cp -r APP/backend/dist/.      "$PKG/dist/"
          cp -r APP/backend/migrations/. "$PKG/migrations/"
          cp    APP/backend/package.json APP/backend/package-lock.json "$PKG/"
          cp    APP/backend/.env.example "$PKG/"

          # Dev-ready .env, pre-filled with sensible defaults so the server
          # starts immediately after `npm install` — see
          # docs/LOCAL_SETUP.md. .env.example (copied above) is left
          # untouched as the blank-slate reference; this is a second,
          # ready-to-run file alongside it. Built as an array (not a
          # heredoc) so this step's own indentation cannot leak into the
          # generated file's content.
          ENV_LINES=(
            '# ── Runtime environment ────────────────────────────────────────'
            '# Standard Node.js convention read by Express and other libraries'
            '# to enable development mode. Not read directly by application'
            '# code in this project, but left set for compatibility with'
            '# tooling that checks it.'
            'NODE_ENV=development'
            ''
            '# ── Server ──────────────────────────────────────────────────────'
            '# Port the backend listens on. Change only if 3000 is already in'
            '# use on this machine.'
            'PORT=3000'
            ''
            '# ── Database ────────────────────────────────────────────────────'
            '# Path to the SQLite file, created automatically on first start.'
            '# A relative path is fine for a local or dev run — it resolves'
            '# against wherever the server is started from.'
            'DB_PATH=data/yahdav.sqlite3'
            ''
            '# ── File uploads ────────────────────────────────────────────────'
            '# Directory where uploaded profile photos are stored, created'
            '# automatically on first start.'
            'UPLOADS_DIR=data/uploads'
            ''
            '# ── Frontend bundles served same-origin ────────────────────────'
            '# The built web app, served at / (see'
            '# backend/src/utils/mountSpa.ts). Already correct for this'
            '# package layout — only change if the public/web folder is moved.'
            'WEB_PUBLIC_DIR=public/web'
            ''
            '# The built admin dashboard, served at /admin. Already correct'
            '# for this package layout — only change if the public/admin'
            '# folder is moved.'
            'ADMIN_PUBLIC_DIR=public/admin'
            ''
            '# ── Domain (remote deployment only — see docs/REMOTE_SETUP.md) ──'
            '# Not used for a local or dev run — this build is meant for'
            '# testing on this machine or network, not a real deployment.'
            '# Leave commented out.'
            '# DOMAIN=your-domain.example.com'
            ''
            '# ── Auth ────────────────────────────────────────────────────────'
            '# REQUIRED. Signs and verifies JWT access/refresh tokens — the'
            '# server will not start without this set. Any random string'
            '# works for local testing; for a real value, generate one with:'
            "#   node -e \"console.log(require('crypto').randomBytes(48).toString('hex'))\""
            'JWT_SECRET=change-me-dev-secret-any-random-string-works-for-local-testing'
            ''
            '# How long an access token stays valid before the client must'
            '# refresh it.'
            'JWT_ACCESS_TTL=15m'
            ''
            '# How long a refresh token stays valid, in days, before the user'
            '# must log in again from scratch.'
            'JWT_REFRESH_TTL_DAYS=30'
            ''
            '# ── CORS ────────────────────────────────────────────────────────'
            '# Comma-separated list of allowed browser origins. Not needed'
            '# for this package default setup — web and admin are served by'
            '# this same server, same origin. These localhost ports only'
            '# matter if web or admin run their own separate Vite dev'
            '# servers instead of this package bundled build.'
            'ADMIN_CORS_ORIGIN=http://localhost:5173,http://localhost:5174'
            ''
            '# ── Push notifications ──────────────────────────────────────────'
            '# Expo push notification gateway. Leave as the default unless'
            '# there is a specific reason to change it.'
            'EXPO_PUSH_URL=https://exp.host/--/api/v2/push/send'
          )
          printf '%s\n' "${ENV_LINES[@]}" > "$PKG/.env"

          cp    APP/backend/docs/LOCAL_SETUP.md APP/backend/docs/REMOTE_SETUP.md "$PKG/docs/"
          cp -r APP/web/dist/.   "$PKG/public/web/"
          cp -r APP/admin/dist/. "$PKG/public/admin/"

          # Vendor @yahdav/shared's compiled output as a sibling folder (not under
          # node_modules/ — a bare node_modules/@yahdav/shared with no matching
          # package.json entry gets deleted the moment LOCAL_SETUP.md's documented
          # `npm install --omit=dev` step runs, since npm prunes anything on disk
          # that isn't declared). backend/package.json declares "file:../shared",
          # correct for the monorepo; rewritten below to "file:./shared" to match
          # this package's own layout, where shared/ sits next to package.json
          # instead of one level up. npm then symlinks node_modules/@yahdav/shared
          # -> ./shared on install, same mechanism as the monorepo's workspace link.
          cp -r APP/shared/dist/. "$PKG/shared/dist/"
          cp    APP/shared/package.json "$PKG/shared/"
          sed -i 's#"file:\.\./shared"#"file:./shared"#' "$PKG/package.json"
          sed -i 's#"resolved": "\.\./shared"#"resolved": "./shared"#' "$PKG/package-lock.json"
          sed -i 's#^    "\.\./shared": {#    "shared": {#' "$PKG/package-lock.json"

          zip -r "$PKG.zip" "$PKG"
          echo "PACKAGE_PATH=$PKG.zip" >> "$GITHUB_ENV"

      - name: Upload to the dev-latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$DEV_RELEASE_TAG" "$PACKAGE_PATH" --clobber

  # Android: unsigned APK, built directly in this runner — same mechanism
  # as release.yml's build-android, but with the runtime-URL gate switched
  # on and the dev bundle ID/display name (via mobile/app.config.js). If
  # ensure-dev-release is skipped (CI Tests didn't pass), this is skipped
  # automatically too — no explicit if: needed here.
  build-android-dev:
    needs: ensure-dev-release
    runs-on: ubuntu-latest
    # Job-level (not step-level) on purpose: this must still be set when
    # Gradle's release build runs later in this job (`./gradlew
    # assembleRelease`, in the "Build the unsigned APK" step below) — that
    # step is what actually invokes Metro to bundle the JS, which is where
    # ServerUrlGate.tsx's process.env.EXPO_PUBLIC_RUNTIME_API_URL_ENABLED
    # check gets inlined. A step-level env: here would only cover the
    # "Generate the native Android project" step's own `expo prebuild` call
    # (native scaffolding only, not JS bundling), leaving the Gradle step
    # without it and silently baking `undefined` into the bundle instead.
    env:
      EXPO_PUBLIC_RUNTIME_API_URL_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Official Gradle action — caches ~/.gradle/caches, the wrapper
      # distribution, and (where safe) task outputs, keyed off the wrapper
      # version and dependency lockfiles. Every ./gradlew invocation later
      # in this job is automatically covered once this step has run; no
      # wrapper syntax change needed. This is what takes this job from a
      # cold ~15-20 min build down to ~3-5 min on a warm cache — the
      # dominant cost of running this workflow on every push.
      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Install shared
        working-directory: APP/shared
        run: npm ci

      - name: Install mobile dependencies
        working-directory: APP/mobile
        run: npm ci

      # EXPO_PUBLIC_RUNTIME_API_URL_ENABLED (set at job level above) is the
      # one flag that distinguishes a dev build from a production build at
      # the JS level — read by mobile/app.config.js (bundle ID / display
      # name) here, and by the app itself at runtime (the ServerUrlGate)
      # during the Gradle build step below. release.yml's build-android
      # never sets this.
      - name: Generate the native Android project (dev configuration)
        working-directory: APP/mobile
        run: npx expo prebuild --platform android --non-interactive

      - name: Build the unsigned APK
        working-directory: APP/mobile/android
        run: ./gradlew assembleRelease

      # Same dynamic lookup as release.yml's build-android — see that
      # file's comment for why this doesn't hardcode the output path.
      - name: Locate and rename the APK
        working-directory: APP/mobile/android
        run: |
          set -eu
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No .apk file found under app/build/outputs/apk — Gradle reported success but produced nothing there. Check the 'Build the unsigned APK' step's output above for the actual output path."
            exit 1
          fi
          echo "Found APK at: $APK"
          OUT="yahdav-android-$DEV_RELEASE_TAG-unsigned.apk"
          cp "$APK" "$OUT"
          echo "APK_PATH=APP/mobile/android/$OUT" >> "$GITHUB_ENV"

      - name: Upload to the dev-latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$DEV_RELEASE_TAG" "$APK_PATH" --clobber
