name: Build shared release artifacts

# Reusable workflow — builds web, admin, and the packaged backend server
# ZIP, and uploads all three as workflow-run artifacts. Does NOT upload
# anything to any GitHub Release; that's each caller's own responsibility
# (release.yml uploads to the release that triggered it, release-dev.yml
# uploads to a rolling dev-latest pre-release — different enough targets
# that folding "upload to a Release" in here would be the wrong place for
# it). Called by release.yml and release-dev.yml.

on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit SHA (or any git ref) to check out for every build in this workflow.'
        required: true
        type: string
      version:
        description: 'Version label used to name the server ZIP artifact, e.g. a release tag or "dev-latest".'
        required: true
        type: string

env:
  NODE_VERSION: '22'

jobs:
  # Web build, on its own so it can run in parallel with build-admin.
  # Uploads dist/ as an artifact for build-server to assemble later.
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # web imports from ../shared (via the @shared alias) at build time —
      # only its node_modules are needed (axios, date-fns), not a compiled
      # dist/: Vite transpiles shared's .ts source directly.
      - name: Install shared's dependencies
        working-directory: APP/shared
        run: npm ci

      - name: Install and build web
        working-directory: APP/web
        run: |
          npm ci
          npm run build

      - name: Upload web build output
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: APP/web/dist

  # Admin build, on its own so it can run in parallel with build-web. Admin
  # doesn't import from shared at all, so no shared install step is needed.
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install and build admin
        working-directory: APP/admin
        run: |
          npm ci
          npm run build

      - name: Upload admin build output
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: APP/admin/dist

  # Server package: compiled backend + build-web's/build-admin's already-
  # built frontends (downloaded as artifacts) as static bundles under
  # public/web and public/admin, plus the setup docs — zipped and uploaded
  # as a workflow artifact (not to any Release — see the note at the top of
  # this file). See APP/backend/docs/LOCAL_SETUP.md for what a consumer of
  # this artifact actually does with it.
  build-server:
    needs: [build-web, build-admin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install shared and build it
        working-directory: APP/shared
        run: |
          npm ci
          npm run build

      - name: Install and build backend
        working-directory: APP/backend
        run: |
          npm ci
          npm run build

      - name: Download web build output
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: APP/web/dist

      - name: Download admin build output
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: APP/admin/dist

      - name: Assemble the server package
        run: |
          set -eu
          PKG="yahdav-server-${{ inputs.version }}"
          mkdir -p "$PKG/dist" "$PKG/migrations" "$PKG/docs" "$PKG/public/web" "$PKG/public/admin"

          cp -r APP/backend/dist/.      "$PKG/dist/"
          cp -r APP/backend/migrations/. "$PKG/migrations/"
          cp    APP/backend/package.json APP/backend/package-lock.json "$PKG/"
          cp    APP/backend/.env.example "$PKG/"
          cp    APP/backend/docs/LOCAL_SETUP.md APP/backend/docs/REMOTE_SETUP.md "$PKG/docs/"
          cp -r APP/web/dist/.   "$PKG/public/web/"
          cp -r APP/admin/dist/. "$PKG/public/admin/"

          zip -r "$PKG.zip" "$PKG"
          echo "PACKAGE_PATH=$PKG.zip" >> "$GITHUB_ENV"

      - name: Upload server package artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-zip
          path: ${{ env.PACKAGE_PATH }}
