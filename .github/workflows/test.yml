name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '25'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APP/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: APP/backend/package-lock.json

      - run: npm ci

      - run: npm test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APP/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: APP/mobile/package-lock.json

      - run: npm ci

      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APP/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            APP/web/package-lock.json
            APP/shared/package-lock.json

      - run: npm ci

      # web imports from ../shared (via the @shared alias), which is its own
      # package with its own node_modules (axios, date-fns) — install it too,
      # or the alias-resolved import fails with nothing installed under
      # APP/shared/node_modules (that folder is gitignored, same as any
      # other node_modules).
      - run: npm ci
        working-directory: APP/shared

      - run: npm test

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APP/admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: APP/admin/package-lock.json

      - run: npm ci

      - run: npm test
