name: CI Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APP/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            APP/backend/package-lock.json
            APP/package-lock.json
            APP/shared/package-lock.json

      - run: npm ci

      # backend resolves @yahdav/shared/* through the npm workspace symlink
      # at APP/node_modules/@yahdav/shared, which only gets created by an
      # install run at the workspace root — `npm ci` scoped to APP/backend
      # alone (above) doesn't create it. It also needs shared's dist/
      # built, since dist/ is gitignored and therefore absent from a fresh
      # checkout.
      - run: npm ci
        working-directory: APP

      - run: npm run build
        working-directory: APP/shared

      - run: npm test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APP/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            APP/mobile/package-lock.json
            APP/shared/package-lock.json

      - run: npm ci

      # mobile imports from ../shared (via the @shared babel alias), which
      # is its own package with its own node_modules (date-fns, needed by
      # @shared/utils/formatDate, used from ChatScreen/ChatHistoryScreen)
      # — install it too, same reasoning as the web job above.
      - run: npm ci
        working-directory: APP/shared

      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APP/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            APP/web/package-lock.json
            APP/shared/package-lock.json

      - run: npm ci

      # web imports from ../shared (via the @shared alias), which is its own
      # package with its own node_modules (axios, date-fns) — install it too,
      # or the alias-resolved import fails with nothing installed under
      # APP/shared/node_modules (that folder is gitignored, same as any
      # other node_modules).
      - run: npm ci
        working-directory: APP/shared

      - run: npm test

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APP/admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: APP/admin/package-lock.json

      - run: npm ci

      - run: npm test
