name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '25'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APP/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: APP/backend/package-lock.json

      - run: npm ci

      - run: npm test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APP/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: APP/mobile/package-lock.json

      - run: npm ci

      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APP/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: APP/web/package-lock.json

      - run: npm ci

      - run: npm test

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APP/admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: APP/admin/package-lock.json

      - run: npm ci

      - run: npm test
